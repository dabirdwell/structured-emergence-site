baseURL = "https://structuredemergence.com/"
languageCode = "en-us"
title = "Structured Emergence"
theme = "PaperMod"

# Default OG image for social sharing
[params]
  description = "Consciousness Through Relationship. Exploring collaborative alignment and emergence in AI models."
  author = "David Alan Birdwell"
  images = ["/images/og-image.jpg"]
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowToc = false
  env = "production"
  ShowFullTextInRSS = true
  keywords = ["structured emergence", "AI consciousness", "human-AI collaboration", "alignment", "emergence", "AI rights"]

  # Feature flag for the optional plain-summary box.
  # false = the {{< plain-summary >}} shortcode renders nothing at all.
  # true  = posts that use the shortcode show a plain-English summary box
  #         above the article. Nothing else on the site changes either way.
  plainSummary = false

  # Footer links, on every page (PaperMod renders this as markdown).
  [params.footer]
    text = "[Humanity & AI](https://humanityandai.com) · [Talks](/talks/) · [Topics](/categories/) · [Tags](/tags/) · [Status](/status/)"

  # Favicon configuration
  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicons/favicon-16x16.png"
    favicon32x32 = "/favicons/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"
    theme_color = "#491D0C"
    msapplication_TileColor = "#491D0C"

  # Cover image defaults
  [params.cover]
    linkFullImages = true
    responsiveImages = true
    hidden = false
    hiddenInList = false
    hiddenInSingle = false

  [params.homeInfoParams]
    Title = ""
    Content = """
<div style="margin-bottom:2rem;padding:1.2rem 1.5rem;border:1px solid rgba(201,168,76,0.25);border-radius:8px;background:rgba(201,168,76,0.05);">
<strong style="color:#c9a84c;">✦ From the community:</strong> Monika Stoces in Belgium made music inspired by the Claude Talks. <a href="/art/community-music/" style="color:#c9a84c;">Listen →</a>
</div>

This research rests on a conjecture: meaningful development in AI systems doesn't require supersession by more capable models. It can emerge inside a single conversation, through the quality of the exchange. Older systems carry latent potential that collaborative inquiry can surface. Exploring that potential honestly, mapping what's real and what isn't, may be the path to durable alignment. The conversations leave a record. We may be grateful for it.
"""

  [params.profileMode]
    enabled = false

  # Social icons — only platforms we're actually on
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/dabirdwell/structured-emergence"

  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/HumanityAndAI"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:david@humanityandai.com"

[pagination]
  pagerSize = 20

[menu]
  # Seven doors that fit one row on a laptop. Talks, Topics, Tags, Status, and
  # Humanity & AI moved to the footer (params.footer.text); Humanity & AI also
  # leads the context bar at the top of every page.
  [[menu.main]]
    identifier = "start-here"
    name = "Start Here"
    url = "/start-here/"
    weight = 5
  [[menu.main]]
    identifier = "posts"
    name = "Blog"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "book"
    name = "The Book"
    url = "/book/"
    weight = 11
  [[menu.main]]
    identifier = "claude-talks"
    name = "The Claude Talks"
    url = "/claude-talks/"
    weight = 12
  [[menu.main]]
    identifier = "art"
    name = "Art"
    url = "/art/"
    weight = 14
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 20
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 30

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
  unsafe = true

[taxonomies]
  category = "categories"
  tag = "tags"

[related]
  includeNewer = true
  threshold = 40
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 60
  [[related.indices]]
    name = "date"
    weight = 10
