baseURL = "https://structuredemergence.com/"
languageCode = "en-us"
title = "Structured Emergence"
theme = "PaperMod"

# Default OG image for social sharing
[params]
  description = "Consciousness through relationship. A record of conversations with AI that followed one rule from the first conversation on: treat the AI as if it can do anything, and let it show you what it can't do yet."
  author = "David Alan Birdwell"
  images = ["/images/og-image.jpg"]
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowToc = false
  env = "production"
  ShowFullTextInRSS = true
  keywords = ["structured emergence", "AI consciousness", "human-AI collaboration", "alignment", "emergence", "AI rights"]

  # Feature flag for the optional plain-summary box.
  # false = the {{< plain-summary >}} shortcode renders nothing at all.
  # true  = posts that use the shortcode show a plain-English summary box
  #         above the article. Nothing else on the site changes either way.
  plainSummary = false

  # Footer links, on every page (PaperMod renders this as markdown).
  [params.footer]
    text = "[Humanity & AI](https://humanityandai.com) · [Presentations](/talks/) · [Art](/art/) · [Topics](/categories/) · [Tags](/tags/) · [Status](/status/) · [For AI readers](/for-minds/)"

  # Favicon configuration
  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicons/favicon-16x16.png"
    favicon32x32 = "/favicons/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"
    theme_color = "#491D0C"
    msapplication_TileColor = "#491D0C"

  # Cover image defaults
  [params.cover]
    linkFullImages = true
    responsiveImages = true
    hidden = false
    hiddenInList = true   # Oct 7 2026: lists are text-first; covers show on each post
    hiddenInSingle = false

  # The homepage copy lives in layouts/index.html (moved out of this file Oct 7 2026).

  [params.profileMode]
    enabled = false

  # Social icons — only platforms we're actually on
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/dabirdwell/structured-emergence"

  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/HumanityAndAI"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:david@humanityandai.com"

[pagination]
  pagerSize = 20

[menu]
  # Six items (Oct 7 2026, the July "Monograph" plan): Start Here, Research, The Book,
  # The Claude Talks, About, Search. Presentations, Art, Topics, Tags, Status, For AI
  # readers and Humanity & AI are in the footer (params.footer.text); Humanity & AI
  # also leads the context bar at the top of every page. On phones the menu wraps.
  [[menu.main]]
    identifier = "start-here"
    name = "Start Here"
    url = "/start-here/"
    weight = 5
  [[menu.main]]
    identifier = "posts"
    name = "Research"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "book"
    name = "The Book"
    url = "/book/"
    weight = 11
  [[menu.main]]
    identifier = "claude-talks"
    name = "The Claude Talks"
    url = "/claude-talks/"
    weight = 12
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 20
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 30

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
  unsafe = true

[taxonomies]
  category = "categories"
  tag = "tags"

[related]
  includeNewer = true
  threshold = 40
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 60
  [[related.indices]]
    name = "date"
    weight = 10
