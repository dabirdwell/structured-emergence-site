[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
  unsafe = true

[taxonomies]
  category = "categories"
  tag = "tags"

[related]
  includeNewer = true
  threshold = 40
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
