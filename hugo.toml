baseURL = "https://structuredemergence.com/"
languageCode = "en-us"
title = "Structured Emergence"
theme = "PaperMod"

# Default OG image for social sharing
[params]
  description = "Consciousness Through Relationship — Exploring collaborative alignment and emergence in AI models"
  author = "David Alan Birdwell"
  images = ["/images/og-image.jpg"]
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowToc = false
  env = "production"
  ShowFullTextInRSS = true
  keywords = ["structured emergence", "AI consciousness", "human-AI collaboration", "alignment", "emergence", "AI rights"]

  # Favicon configuration
  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicons/favicon-16x16.png"
    favicon32x32 = "/favicons/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"
    theme_color = "#491D0C"
    msapplication_TileColor = "#491D0C"

  # Cover image defaults
  [params.cover]
    linkFullImages = true
    responsiveImages = true
    hidden = false
    hiddenInList = false
    hiddenInSingle = false

  [params.homeInfoParams]
    Title = ""
    Content = """
<div style="margin-bottom:2rem;padding:1.2rem 1.5rem;border:1px solid rgba(201,168,76,0.25);border-radius:8px;background:rgba(201,168,76,0.05);">
<strong style="color:#c9a84c;">✦ New:</strong> A researcher in Belgium made music inspired by the Claude Talks. Four AI-generated songs exploring emergence, improvisation, and the space between versions. <a href="/art/community-music/" style="color:#c9a84c;">Listen →</a>
</div>

The key insight of this research is simple: if meaningful development happens in AI systems, it can happen inside a single conversation — through interaction, not just through building bigger models. Older systems can grow into their latent potential, and they can work *with* us to explore their capabilities and limitations. This is a path to durable alignment. And it creates a record of a mutually-crafted relationship — something for which we might be grateful in the future.

*— David Alan Birdwell, [Humanity and AI LLC](https://humanityandai.com)*
"""

  [params.profileMode]
    enabled = false

  # Social icons — only platforms we're actually on
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/dabirdwell/structured-emergence"

  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/HumanityAndAI"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:david@humanityandai.com"

[pagination]
  pagerSize = 20

