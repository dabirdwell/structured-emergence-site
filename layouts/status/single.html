{{- define "main" }}

<article class="post-single">
  <header class="post-header">
    {{ partial "breadcrumbs.html" . }}
    <h1 class="post-title">{{ .Title }}</h1>
    {{- if .Description }}
    <div class="post-description">{{ .Description }}</div>
    {{- end }}
  </header>

  <div class="post-content">

    <div class="status-banner">
      <span class="status-check-label">Last checked:</span>
      <span class="status-check-date">April 4, 2026</span>
      <span class="status-note">This page is manually updated.</span>
    </div>

    <div class="status-grid">
      {{ .Content }}
    </div>

  </div>
</article>

<style>
  .status-banner {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1.25rem;
    margin-bottom: 2rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    font-size: 0.9rem;
  }
  .status-check-label {
    color: var(--secondary);
  }
  .status-check-date {
    font-weight: 600;
    color: var(--primary);
  }
  .status-note {
    color: var(--secondary);
    font-style: italic;
    margin-left: auto;
  }

  .status-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
  }

  .status-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem 1.5rem;
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 0.75rem 1rem;
    transition: border-color 0.2s;
  }
  .status-card:hover {
    border-color: var(--primary);
  }

  .status-indicator {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-indicator.active {
    background: #22c55e;
    box-shadow: 0 0 6px rgba(34, 197, 94, 0.4);
  }
  .status-indicator.degraded {
    background: #f59e0b;
    box-shadow: 0 0 6px rgba(245, 158, 11, 0.4);
  }
  .status-indicator.down {
    background: #ef4444;
    box-shadow: 0 0 6px rgba(239, 68, 68, 0.4);
  }
  .status-indicator.maintenance {
    background: #6366f1;
    box-shadow: 0 0 6px rgba(99, 102, 241, 0.4);
  }

  .status-info {
    min-width: 0;
  }
  .status-name {
    font-weight: 600;
    font-size: 1.05rem;
    color: var(--primary);
  }
  .status-name a {
    color: inherit;
    text-decoration: none;
  }
  .status-name a:hover {
    text-decoration: underline;
  }
  .status-description {
    font-size: 0.85rem;
    color: var(--secondary);
    margin-top: 0.15rem;
  }

  .status-meta {
    text-align: right;
    flex-shrink: 0;
  }
  .status-version {
    font-size: 0.8rem;
    font-weight: 500;
    padding: 0.2rem 0.6rem;
    border-radius: 4px;
    background: var(--code-bg);
    color: var(--secondary);
    display: inline-block;
  }
  .status-updated {
    font-size: 0.75rem;
    color: var(--secondary);
    margin-top: 0.25rem;
  }

  @media (max-width: 600px) {
    .status-card {
      grid-template-columns: auto 1fr;
    }
    .status-meta {
      grid-column: 2;
      text-align: left;
    }
    .status-note {
      margin-left: 0;
      display: block;
      width: 100%;
    }
  }
</style>

{{- end }}
